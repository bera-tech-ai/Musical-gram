<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BERAFLIX by Bera Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { gold: '#F5B82E', ink: '#07070A', panel: '#15151D' },
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    body {
      background:
        radial-gradient(ellipse at 15% 0%, rgba(245, 184, 46, 0.22), transparent 45%),
        radial-gradient(ellipse at 90% 10%, rgba(245, 184, 46, 0.12), transparent 40%),
        #07070a;
      background-attachment: fixed;
    }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .gold-text {
      background: linear-gradient(180deg, #ffe08a 0%, #f5b82e 55%, #b97a0c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    input[type='range'] { accent-color: #f5b82e; }
  </style>
</head>
<body class="min-h-screen font-sans text-white antialiased">

  <header class="sticky top-0 z-40 border-b border-white/5 bg-ink/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-3">
      <a href="#/" class="flex items-center gap-2">
        <span class="grid h-9 w-9 place-items-center rounded-md bg-gold text-xl font-black text-black">B</span>
        <span class="leading-none">
          <span class="block text-lg font-black tracking-tight text-gold">BERAFLIX</span>
          <span class="block text-[8px] tracking-[0.35em] text-gold/70">BY BERA TECH</span>
        </span>
      </a>
      <nav id="top-nav" class="ml-10 hidden gap-8 sm:flex"></nav>
      <div class="ml-auto flex items-center gap-2">
        <button id="search-btn" class="p-2 text-white/80" aria-label="Search"></button>
        <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-amber-300 to-amber-700 text-sm font-bold text-black">B</span>
      </div>
    </div>
    <div id="search-bar" class="hidden border-t border-white/5">
      <div class="mx-auto max-w-7xl px-4 py-3">
        <input id="search" type="search" placeholder="Search titles"
          class="w-full rounded-full border border-white/10 bg-panel px-4 py-2.5 text-sm outline-none placeholder:text-white/40 focus:border-gold" />
      </div>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-7xl px-4 py-6 pb-28 sm:pb-12">
    <p class="py-20 text-center text-white/50">Loading catalog…</p>
  </main>

  <footer class="pb-28 pt-10 text-center sm:pb-10">
    <p class="text-3xl font-black tracking-tight gold-text">BERAFLIX</p>
    <p class="mt-1 text-[10px] tracking-[0.35em] text-gold/70">BY BERA TECH</p>
    <p class="mt-5 text-xs tracking-[0.4em] text-white/70">STREAM • EXPLORE • ENJOY</p>
    <p class="mt-4 text-sm italic text-gold/80">Your Next Favorite Movie Is Here…</p>
    <p class="mt-6 text-[11px] text-white/30">Catalog data provided by TECH SPACE KE API.</p>
  </footer>

  <nav id="bottom-nav" class="fixed inset-x-0 bottom-0 z-40 grid grid-cols-3 border-t border-white/5 bg-ink/95 backdrop-blur sm:hidden"></nav>

  <script>
    // ---------- Icons ----------
    const I = {
      home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
      compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
      bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
      play: '<path d="M7 4v16l13-8z" fill="currentColor"/>',
      pause: '<rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/>',
      check: '<path d="m5 12 5 5 9-10"/>',
      bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
      phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
      shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
      playCircle: '<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor"/>',
      back: '<path d="m15 18-6-6 6-6"/>',
      gear: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
      more: '<circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/>',
      rewind: '<path d="M11 19 2 12l9-7z" fill="currentColor"/><path d="M22 19l-9-7 9-7z" fill="currentColor"/>',
      forward: '<path d="m13 19 9-7-9-7z" fill="currentColor"/><path d="m2 19 9-7-9-7z" fill="currentColor"/>',
      download: '<path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    };
    const svg = (name, cls = 'h-5 w-5') =>
      `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name]}</svg>`;

    // ---------- Helpers ----------
    const $ = (id) => document.getElementById(id);
    const app = $('app');
    const enc = encodeURIComponent;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const store = {
      get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
    };

    const fmtTime = (s) => {
      if (!isFinite(s) || s < 0) s = 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = String(Math.floor(s % 60)).padStart(2, '0');
      return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    };
    const fmtRuntime = (min) => {
      const h = Math.floor(min / 60), m = min % 60;
      return h ? `${h}h ${m}m` : `${m}m`;
    };

    // ---------- State ----------
    let catalog = [];
    let banners = [];
    let bannerIndex = 0;
    let bannerTimer = null;
    let watchlist = store.get('bf-watchlist', []);
    let history = store.get('bf-history', []);
    let genreFilter = '';
    let typeFilter = 'all';
    let shelfTab = 'watchlist';
    let play = null;
    let hls = null;

    const bySlug = (slug) => catalog.find((m) => m.slug === slug);
    const q = () => $('search').value.trim().toLowerCase();
    const filtered = () => {
      let list = catalog;
      if (typeFilter === 'movie') list = list.filter((m) => m.type === 'Movie');
      if (typeFilter === 'series') list = list.filter((m) => m.type === 'Series');
      if (typeFilter === 'trending') list = [...list].sort((a, b) => b.ratingCount - a.ratingCount).slice(0, 40);
      if (genreFilter) list = list.filter((m) => m.genre.includes(genreFilter));
      return list;
    };
    const topGenres = (n) => {
      const counts = {};
      for (const m of catalog) for (const g of m.genre) counts[g] = (counts[g] || 0) + 1;
      return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, n).map(([g]) => g);
    };
    const recordHistory = (slug) => {
      history = [slug, ...history.filter((s) => s !== slug)].slice(0, 30);
      store.set('bf-history', history);
    };

    // ---------- Components ----------
    const chip = (label, on, attrs) =>
      `<button ${attrs} class="shrink-0 rounded-full px-4 py-1.5 text-xs ${on
        ? 'bg-gold font-semibold text-black'
        : 'border border-white/10 bg-panel text-white/80'}">${esc(label)}</button>`;

    const card = (m, extra = '') => `
      <a href="#/title/${enc(m.slug)}" class="group block ${extra}">
        <div class="relative aspect-[2/3] overflow-hidden rounded-xl bg-panel ring-1 ring-white/5 transition group-hover:ring-gold/60">
          <img src="${esc(m.cover)}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-300 group-hover:scale-105" />
          ${m.rating !== null ? `<span class="absolute right-2 top-2 rounded bg-black/70 px-1.5 py-0.5 text-[11px] font-semibold text-gold">★ ${m.rating.toFixed(1)}</span>` : ''}
        </div>
        <h3 class="mt-2 truncate text-sm font-medium">${esc(m.title)}</h3>
        <p class="truncate text-xs text-white/50">${esc([m.year, m.genre[0]].filter(Boolean).join(' · '))}</p>
      </a>`;

    const row = (title, items, href = '') => !items.length ? '' : `
      <section class="mb-10">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-lg font-bold">${esc(title)}</h2>
          ${href ? `<a href="${href}" class="text-xs font-semibold text-gold">See All ›</a>` : ''}
        </div>
        <div class="no-scrollbar -mx-4 flex gap-4 overflow-x-auto px-4 pb-2">
          ${items.map((m) => card(m, 'w-36 shrink-0 sm:w-44')).join('')}
        </div>
      </section>`;

    const grid = (items) => `
      <div class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
        ${items.map((m) => card(m)).join('')}
      </div>`;

    const empty = (msg) => `<p class="py-16 text-center text-white/50">${esc(msg)}</p>`;

    const listRow = (m, list) => `
      <div class="flex items-center gap-4 border-b border-white/5 py-3">
        <a href="#/title/${enc(m.slug)}" class="h-20 w-14 shrink-0 overflow-hidden rounded-md bg-panel">
          <img src="${esc(m.cover)}" alt="" loading="lazy" class="h-full w-full object-cover" />
        </a>
        <div class="min-w-0 flex-1">
          <p class="truncate font-semibold">${esc(m.title)}</p>
          <p class="text-xs text-white/50">${esc([m.year, m.durationMin ? fmtRuntime(m.durationMin) : ''].filter(Boolean).join(' · '))}</p>
        </div>
        <button data-act="remove" data-v="${esc(list)}|${esc(m.slug)}" class="p-2 text-white/50 hover:text-gold" aria-label="Remove">${svg('more')}</button>
      </div>`;

    function brandHero() {
      const feat = (icon, label) => `
        <div class="flex flex-col items-center gap-2 text-center text-xs text-white/80 sm:text-sm">
          <span class="text-gold">${svg(icon, 'h-7 w-7')}</span>${label}
        </div>`;
      return `
        <section class="mb-10 text-center">
          <div class="inline-flex items-center gap-3">
            <span class="grid h-14 w-14 place-items-center rounded-lg bg-gold text-3xl font-black text-black">B</span>
            <span class="text-5xl font-black leading-none tracking-tight gold-text sm:text-6xl">BERAFLIX</span>
          </div>
          <p class="mt-2 text-xs tracking-[0.4em] text-gold/80">BY BERA TECH</p>
          <p class="mt-8 text-sm font-semibold tracking-[0.2em] sm:text-base">
            <span class="text-gold">MORE</span> MOVIES. <span class="text-gold">MORE</span> EMOTIONS.
          </p>
          <p class="mt-1 text-sm tracking-[0.2em] text-white/80">ALL IN ONE PLACE.</p>
          <div class="mt-8 grid grid-cols-2 gap-6 border-y border-white/10 py-6 sm:grid-cols-4">
            ${feat('playCircle', 'HD / 4K Streaming')}
            ${feat('bolt', 'Fast &amp; Smooth Playback')}
            ${feat('phone', 'Mobile First Experience')}
            ${feat('shield', 'Safe &amp; Secure Streaming')}
          </div>
        </section>`;
    }

    function heroBanner() {
      if (!banners.length) return '';
      const b = banners[bannerIndex];
      const meta = [b.year, b.genre.join(' · ')].filter(Boolean).join(' · ');
      return `
        <section id="hero" class="relative mb-10 overflow-hidden rounded-2xl bg-panel">
          <img src="${esc(b.image)}" alt="" class="absolute inset-0 h-full w-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-r from-black via-black/60 to-transparent"></div>
          <div class="relative flex min-h-[300px] flex-col justify-end p-5 sm:min-h-[400px] sm:p-10">
            <h2 class="max-w-md text-4xl font-black sm:text-6xl">${esc(b.title)}</h2>
            <p class="mt-2 text-sm text-white/70">${esc(meta)}</p>
            <a href="#/play/${enc(b.slug)}" class="mt-5 w-fit rounded-full bg-gold px-7 py-2.5 text-sm font-semibold text-black">Watch Now</a>
            <div class="mt-6 flex gap-1.5">
              ${banners.map((_, i) => `<button data-act="dot" data-v="${i}" aria-label="Slide ${i + 1}"
                class="h-1.5 rounded-full transition-all ${i === bannerIndex ? 'w-6 bg-gold' : 'w-1.5 bg-white/30'}"></button>`).join('')}
            </div>
          </div>
        </section>`;
    }

    function startRotation() {
      clearInterval(bannerTimer);
      if (banners.length < 2) return;
      bannerTimer = setInterval(() => {
        bannerIndex = (bannerIndex + 1) % banners.length;
        const h = $('hero');
        if (h) h.outerHTML = heroBanner();
      }, 6000);
    }

    // ---------- Pages ----------
    function notFound() {
      app.innerHTML = `<div class="py-24 text-center">
        <h1 class="text-2xl font-bold">Title not found</h1>
        <a href="#/" class="mt-4 inline-block text-gold">Back to Discover</a></div>`;
    }

    function renderDiscover(query) {
      clearInterval(bannerTimer);
      if (query) {
        const results = catalog.filter((m) => m.title.toLowerCase().includes(query));
        app.innerHTML = `<h1 class="mb-5 text-2xl font-bold">Results for “${esc(query)}”</h1>
          ${results.length ? grid(results) : empty('No titles match your search.')}`;
        return;
      }
      const byVotes = (list) => [...list].sort((a, b) => b.ratingCount - a.ratingCount);
      app.innerHTML = brandHero()
        + heroBanner()
        + row('Trending Movies', byVotes(catalog.filter((m) => m.type === 'Movie')).slice(0, 12), '#/explore')
        + row('Popular TV Shows', byVotes(catalog.filter((m) => m.type === 'Series')).slice(0, 12), '#/explore');
      startRotation();
    }

    function renderExplore() {
      const chips = [['all', 'All'], ['movie', 'Movies'], ['series', 'TV Shows'], ['trending', 'Trending']];
      const tiles = topGenres(9).map((g) => {
        const sample = catalog.find((m) => m.genre.includes(g));
        const on = genreFilter === g;
        return `
          <button data-act="genre" data-v="${esc(g)}"
            class="group relative aspect-[4/3] overflow-hidden rounded-xl bg-panel ring-1 ${on ? 'ring-gold' : 'ring-white/5'}">
            <img src="${esc(sample?.cover || '')}" alt="" loading="lazy"
              class="h-full w-full object-cover opacity-70 transition duration-300 group-hover:scale-105 group-hover:opacity-90" />
            <span class="absolute inset-0 grid place-items-center bg-black/35 text-sm font-bold">${esc(g)}</span>
          </button>`;
      }).join('');
      const list = filtered();
      const topRated = [...list].sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0)).slice(0, 12);

      app.innerHTML = `
        <h1 class="mb-4 text-2xl font-bold">Explore</h1>
        <div class="no-scrollbar mb-6 flex gap-2 overflow-x-auto">
          ${chips.map(([v, l]) => chip(l, typeFilter === v, `data-act="type" data-v="${v}"`)).join('')}
        </div>
        <div class="mb-10 grid grid-cols-3 gap-3 md:grid-cols-5">${tiles}</div>
        ${genreFilter
          ? `<h2 class="mb-4 text-lg font-bold">${esc(genreFilter)} <span class="text-sm font-normal text-white/40">${list.length} titles</span></h2>${grid(list)}`
          : row('Top Rated', topRated)}`;
    }

    function renderShelf() {
      const tabs = [['watchlist', 'Watchlist'], ['downloads', 'Downloads'], ['history', 'History']];
      let body;

      if (shelfTab === 'watchlist') {
        const list = watchlist.map(bySlug).filter(Boolean);
        body = list.length ? list.map((m) => listRow(m, 'watchlist')).join('')
          : empty('Titles you add to My Shelf appear here.');
      } else if (shelfTab === 'history') {
        const list = history.map(bySlug).filter(Boolean);
        body = list.length ? list.map((m) => listRow(m, 'history')).join('')
          : empty('Titles you open appear here.');
      } else {
        const dls = store.get('bf-downloads', []).filter((d) => bySlug(d.slug));
        body = dls.length ? dls.map((d) => {
          const m = bySlug(d.slug);
          return `
            <div class="flex items-center gap-4 border-b border-white/5 py-3">
              <a href="#/title/${enc(m.slug)}" class="h-20 w-14 shrink-0 overflow-hidden rounded-md bg-panel">
                <img src="${esc(m.cover)}" alt="" loading="lazy" class="h-full w-full object-cover" />
              </a>
              <div class="min-w-0 flex-1">
                <p class="truncate font-semibold">${esc(m.title)}</p>
                <p class="text-xs text-white/50">${esc(d.label)}</p>
              </div>
              <a href="${esc(d.url)}" download class="rounded-full border border-white/15 bg-panel px-4 py-2 text-xs">Download</a>
            </div>`;
        }).join('') : empty('Titles you download from the player appear here.');
      }

      app.innerHTML = `
        <h1 class="mb-5 text-2xl font-bold">My Shelf</h1>
        <div class="no-scrollbar mb-4 flex gap-2 overflow-x-auto">
          ${tabs.map(([v, l]) => chip(l, shelfTab === v, `data-act="shelf" data-v="${v}"`)).join('')}
        </div>
        <div>${body}</div>`;
    }

    function renderDetail(slug) {
      const m = bySlug(slug);
      if (!m) return notFound();

      const backdrop = banners.find((b) => b.slug === slug)?.image || m.cover;
      const inList = watchlist.includes(slug);

      app.innerHTML = `
        <section class="relative -mx-4 -mt-6 h-[340px] overflow-hidden sm:mx-0 sm:mt-0 sm:h-[460px] sm:rounded-2xl">
          <img src="${esc(backdrop)}" alt="" class="h-full w-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/40 to-transparent"></div>
          <a href="#/" class="absolute left-4 top-4 rounded-full bg-black/50 p-2" aria-label="Back">${svg('back')}</a>
        </section>

        <div class="relative -mt-24 px-1 sm:-mt-32">
          <h1 class="text-3xl font-black sm:text-5xl">${esc(m.title)}</h1>
          <p class="mt-2 flex flex-wrap items-center gap-2 text-sm text-white/70">
            ${m.rating !== null ? `<span class="text-gold">★ ${m.rating.toFixed(1)}</span><span>·</span>` : ''}
            ${m.year ? `<span>${esc(m.year)}</span>` : ''}
            ${m.durationMin ? `<span>·</span><span>${fmtRuntime(m.durationMin)}</span>` : `<span>·</span><span>${esc(m.type)}</span>`}
          </p>
          <div class="mt-4 flex flex-wrap gap-2">
            ${m.genre.map((g) => `<span class="rounded-full border border-white/10 bg-panel px-3 py-1 text-xs">${esc(g)}</span>`).join('')}
          </div>

          <a href="#/play/${enc(m.slug)}"
            class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-gold py-3.5 font-bold text-black">
            ${svg('play', 'h-4 w-4')} Play Now
          </a>
          <button data-act="watch" data-v="${esc(m.slug)}"
            class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-white/15 bg-panel py-3.5 font-semibold">
            ${svg(inList ? 'check' : 'plus', 'h-4 w-4')} ${inList ? 'On My Shelf' : 'Add to My Shelf'}
          </button>

          <h2 class="mt-8 text-lg font-bold">Synopsis</h2>
          <p class="mt-2 leading-relaxed text-white/75">${esc(m.description) || 'No synopsis available from the source.'}</p>
          ${m.ratingCount ? `<p class="mt-3 text-xs text-white/40">Based on ${m.ratingCount.toLocaleString()} IMDb ratings</p>` : ''}
        </div>`;
      recordHistory(slug);
    }

    function renderPlayer(slug) {
      const m = bySlug(slug);
      if (!m) return notFound();
      recordHistory(slug);
      play = { slug, sources: [], subs: [{ label: 'Off', url: '' }], src: -1, sub: 0 };

      app.innerHTML = `
        <section class="-mx-4 -mt-6 bg-black sm:mx-0 sm:mt-0 sm:overflow-hidden sm:rounded-2xl">
          <div class="relative aspect-video w-full bg-black">
            <video id="video" playsinline class="h-full w-full bg-black"></video>
            <div id="status" class="pointer-events-none absolute inset-0 grid place-items-center text-sm text-white/70"></div>
            <a href="#/title/${enc(slug)}" class="absolute left-3 top-3 rounded-full bg-black/50 p-2" aria-label="Back">${svg('back')}</a>
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 to-transparent px-4 pb-3 pt-10">
              <input id="seek" type="range" min="0" max="1000" value="0" class="w-full" />
              <div class="mt-1 flex justify-between text-[11px] text-white/70">
                <span id="now">0:00</span><span id="dur">0:00</span>
              </div>
              <div class="mt-2 flex items-center justify-between">
                <span class="w-6"></span>
                <div class="flex items-center gap-10">
                  <button data-act="back10" class="text-white" aria-label="Back 10 seconds">${svg('rewind', 'h-7 w-7')}</button>
                  <button id="toggle" data-act="toggle" class="rounded-full bg-gold p-2.5 text-black" aria-label="Play or pause">${svg('play', 'h-6 w-6')}</button>
                  <button data-act="fwd10" class="text-white" aria-label="Forward 10 seconds">${svg('forward', 'h-7 w-7')}</button>
                </div>
                <button data-act="gear" class="text-white" aria-label="Settings">${svg('gear', 'h-6 w-6')}</button>
              </div>
            </div>
          </div>
        </section>

        <section class="px-1 pt-5">
          <h1 class="text-2xl font-black sm:text-3xl">${esc(m.title)}</h1>
          <div class="mt-2 flex flex-wrap items-center gap-3 text-sm text-white/70">
            ${m.rating !== null ? `<span class="text-gold">★ ${m.rating.toFixed(1)}</span>` : ''}
            ${m.year ? `<span>${esc(m.year)}</span>` : ''}
            ${m.durationMin ? `<span>${fmtRuntime(m.durationMin)}</span>` : ''}
            <span id="cc" class="hidden rounded bg-gold px-1.5 py-0.5 text-[10px] font-bold text-black">CC</span>
          </div>

          <div id="settings" class="mt-6 space-y-6">
            <div>
              <h2 class="mb-2 text-sm font-semibold">Subtitles</h2>
              <div id="subs-list" class="overflow-hidden rounded-xl border border-white/10 bg-panel"></div>
            </div>
            <div>
              <h2 class="mb-2 text-sm font-semibold">Sources</h2>
              <div id="src-list" class="overflow-hidden rounded-xl border border-white/10 bg-panel"></div>
            </div>
            <div>
              <h2 class="mb-2 text-sm font-semibold">Download</h2>
              <div id="dl-list" class="overflow-hidden rounded-xl border border-white/10 bg-panel"></div>
            </div>
          </div>
        </section>`;

      bindPlayer();
      loadPlay(slug);
    }

    // ---------- Player ----------
    function setStatus(text) {
      const el = $('status');
      if (el) el.textContent = text;
    }

    function destroyHls() {
      if (hls) { hls.destroy(); hls = null; }
    }

    function bindPlayer() {
      const v = $('video');
      if (!v) return;
      const toggle = $('toggle');
      const seek = $('seek');

      v.addEventListener('click', () => (v.paused ? v.play() : v.pause()));
      v.addEventListener('play', () => { toggle.innerHTML = svg('pause', 'h-6 w-6'); setStatus(''); });
      v.addEventListener('pause', () => { toggle.innerHTML = svg('play', 'h-6 w-6'); });
      v.addEventListener('waiting', () => setStatus('Buffering…'));
      v.addEventListener('playing', () => setStatus(''));
      v.addEventListener('error', () => setStatus('This stream could not be played.'));
      v.addEventListener('loadedmetadata', () => { $('dur').textContent = fmtTime(v.duration); });
      v.addEventListener('timeupdate', () => {
        const d = v.duration || 0;
        seek.value = d ? Math.round((v.currentTime / d) * 1000) : 0;
        $('now').textContent = fmtTime(v.currentTime);
      });
    }

    function playSource(i) {
      const v = $('video');
      if (!v || !play || !play.sources.length) return;
      const src = play.sources[Math.max(0, i)];
      const resumeAt = v.currentTime || 0;
      destroyHls();

      if (src.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(src.url);
        hls.attachMedia(v);
      } else {
        v.src = src.url;
      }
      if (resumeAt > 0) v.addEventListener('loadedmetadata', () => { v.currentTime = resumeAt; }, { once: true });
      v.play().catch(() => {});
    }

    function setSub(i) {
      const v = $('video');
      if (!v || !play) return;
      play.sub = i;
      v.querySelectorAll('track').forEach((t) => t.remove());
      const s = play.subs[i];
      if (s && s.url) {
        const tr = document.createElement('track');
        tr.kind = 'subtitles';
        tr.label = s.label;
        tr.srclang = s.lang || 'en';
        tr.src = s.url;
        tr.default = true;
        v.appendChild(tr);
        tr.track.mode = 'showing';
      }
      renderOptions();
    }

    function renderOptions() {
      const subs = $('subs-list');
      if (!subs || !play) return;
      const check = svg('check', 'h-4 w-4 text-gold');
      const optRow = (label, on, attrs) => `
        <button ${attrs} class="flex w-full items-center justify-between border-b border-white/5 px-4 py-3 text-left last:border-0 hover:bg-white/5">
          <span class="flex items-center gap-3 ${on ? 'text-gold' : 'text-white/90'}"><span class="text-white/40">›</span>${esc(label)}</span>
          ${on ? check : ''}
        </button>`;

      subs.innerHTML = play.subs.map((s, i) => optRow(s.label, i === play.sub, `data-act="sub" data-v="${i}"`)).join('');
      $('src-list').innerHTML =
        optRow('Auto', play.src === -1, 'data-act="src" data-v="-1"') +
        play.sources.map((s, i) => optRow(s.label, i === play.src, `data-act="src" data-v="${i}"`)).join('');
      $('dl-list').innerHTML = play.sources.length
        ? play.sources.map((s, i) => `
            <a href="${esc(s.downloadUrl)}" download data-act="dl" data-v="${i}"
              class="flex w-full items-center justify-between border-b border-white/5 px-4 py-3 last:border-0 hover:bg-white/5">
              <span class="flex items-center gap-3"><span class="text-white/40">›</span>${esc(s.label)}</span>
              ${svg('download', 'h-4 w-4 text-white/60')}
            </a>`).join('')
        : '<p class="px-4 py-3 text-sm text-white/40">Not available yet</p>';

      const cc = $('cc');
      if (cc) cc.classList.toggle('hidden', play.sub === 0);
    }

    async function loadPlay(slug) {
      const m = bySlug(slug);
      if (!m) return setStatus('Title not found.');
      setStatus('Loading…');
      try {
        const res = await fetch(`/api/play?subjectId=${enc(m.id)}&detailPath=${enc(m.slug)}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (!play || play.slug !== slug) return;

        play.sources = data.qualities || [];
        play.subs = [{ label: 'Off', url: '' }, ...(data.subtitles || [])];
        if (!play.sources.length) return setStatus('No stream available for this title.');

        const en = play.subs.findIndex((s, i) => i > 0 && s.lang === 'en');
        play.src = -1;
        playSource(0);
        setSub(en > 0 ? en : 0);
        setStatus('');
      } catch {
        setStatus('This title could not be played right now.');
      }
    }

    // ---------- Routing ----------
    function setActiveTab(key) {
      document.querySelectorAll('.tab').forEach((a) => {
        const on = a.dataset.tab === key;
        a.classList.toggle('text-gold', on);
        a.classList.toggle('text-white/60', !on);
      });
    }

    function route() {
      clearInterval(bannerTimer);
      const old = $('video');
      if (old) old.pause();
      destroyHls();

      const [page = '', ...rest] = location.hash.replace(/^#\/?/, '').split('/');
      const slug = decodeURIComponent(rest.join('/'));
      if (page !== 'play') play = null;

      setActiveTab(page === 'explore' || page === 'shelf' ? page : (page === '' || page === 'discover' ? 'discover' : ''));

      if (page === 'title') renderDetail(slug);
      else if (page === 'play') renderPlayer(slug);
      else if (page === 'explore') renderExplore();
      else if (page === 'shelf') renderShelf();
      else renderDiscover(q());
      window.scrollTo(0, 0);
    }

    // ---------- Events ----------
    app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act;
      const v = el.dataset.v;

      if (act === 'dot') {
        bannerIndex = +v;
        const h = $('hero');
        if (h) h.outerHTML = heroBanner();
      } else if (act === 'genre') {
        genreFilter = genreFilter === v ? '' : v;
        renderExplore();
      } else if (act === 'type') {
        typeFilter = v;
        renderExplore();
      } else if (act === 'shelf') {
        shelfTab = v;
        renderShelf();
      } else if (act === 'remove') {
        const [list, slug] = v.split('|');
        if (list === 'watchlist') {
          watchlist = watchlist.filter((s) => s !== slug);
          store.set('bf-watchlist', watchlist);
        } else {
          history = history.filter((s) => s !== slug);
          store.set('bf-history', history);
        }
        renderShelf();
      } else if (act === 'watch') {
        watchlist = watchlist.includes(v) ? watchlist.filter((s) => s !== v) : [...watchlist, v];
        store.set('bf-watchlist', watchlist);
        renderDetail(v);
      } else if (act === 'toggle') {
        const vid = $('video');
        if (vid) (vid.paused ? vid.play() : vid.pause());
      } else if (act === 'back10') {
        const vid = $('video');
        if (vid) vid.currentTime = Math.max(0, vid.currentTime - 10);
      } else if (act === 'fwd10') {
        const vid = $('video');
        if (vid) vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
      } else if (act === 'gear') {
        $('settings')?.scrollIntoView({ behavior: 'smooth' });
      } else if (act === 'src') {
        if (!play) return;
        play.src = +v;
        playSource(play.src);
        renderOptions();
      } else if (act === 'sub') {
        if (play) setSub(+v);
      } else if (act === 'dl') {
        // Records the download, then the anchor's own download attribute runs.
        if (!play) return;
        const s = play.sources[+v];
        const list = store.get('bf-downloads', []);
        store.set('bf-downloads', [
          { slug: play.slug, label: s.label, url: s.downloadUrl, at: Date.now() },
          ...list.filter((d) => !(d.slug === play.slug && d.label === s.label)),
        ].slice(0, 50));
      }
    });

    app.addEventListener('input', (e) => {
      if (e.target.id !== 'seek') return;
      const vid = $('video');
      if (vid && vid.duration) vid.currentTime = (e.target.value / 1000) * vid.duration;
    });

    $('search-btn').innerHTML = svg('search', 'h-5 w-5');
    $('search-btn').addEventListener('click', () => {
      const bar = $('search-bar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) $('search').focus();
    });

    $('search').addEventListener('input', () => {
      if (location.hash && location.hash !== '#/') location.hash = '#/';
      else renderDiscover(q());
    });

    const navItems = [
      ['discover', '#/', 'home', 'Discover'],
      ['explore', '#/explore', 'compass', 'Explore'],
      ['shelf', '#/shelf', 'bookmark', 'My Shelf'],
    ];

    async function init() {
      $('top-nav').innerHTML = navItems.map(([key, href, icon, label]) => `
        <a href="${href}" data-tab="${key}" class="tab flex items-center gap-2 py-4 text-sm text-white/60">${svg(icon, 'h-4 w-4')}${label}</a>`).join('');
      $('bottom-nav').innerHTML = navItems.map(([key, href, icon, label]) => `
        <a href="${href}" data-tab="${key}" class="tab flex flex-col items-center gap-1 py-3 text-[11px] text-white/60">${svg(icon, 'h-5 w-5')}${label}</a>`).join('');

      app.innerHTML = '<p class="py-20 text-center text-white/50">Loading catalog…</p>';
      try {
        const res = await fetch('/api/home');
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        catalog = data.items || [];
        banners = data.banners || [];
        window.addEventListener('hashchange', route);
        route();
      } catch {
        app.innerHTML = `<p class="rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-300">
          Could not load the catalog. Please try again shortly.</p>`;
      }
    }
    init();
  </script>
</body>
</html>
